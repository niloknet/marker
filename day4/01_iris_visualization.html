<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g><path d="M6,9A3,3,0,1,1,9,6,3,3,0,0,1,6,9ZM6,5A1,1,0,1,0,7,6,1,1,0,0,0,6,5Z"/><path d="M12,15a3,3,0,1,1,3-3A3,3,0,0,1,12,15Zm0-4a1,1,0,1,0,1,1A1,1,0,0,0,12,11Z"/><path d="M18,9a3,3,0,1,1,3-3A3,3,0,0,1,18,9Zm0-4a1,1,0,1,0,1,1A1,1,0,0,0,18,5Z"/><path d="M18,21a3,3,0,1,1,3-3A3,3,0,0,1,18,21Zm0-4a1,1,0,1,0,1,1A1,1,0,0,0,18,17Z"/><path d="M6,21a3,3,0,1,1,3-3A3,3,0,0,1,6,21Zm0-4a1,1,0,1,0,1,1A1,1,0,0,0,6,17Z"/><rect height="4.83" transform="translate(-3.73 9) rotate(-45)" width="2" x="8" y="6.59"/><rect height="2" transform="translate(-1.97 13.24) rotate(-45)" width="4.83" x="12.59" y="8"/><rect height="2" transform="translate(-7.97 10.76) rotate(-45)" width="4.83" x="6.59" y="14"/><rect height="4.83" transform="translate(-6.21 15) rotate(-45)" width="2" x="14" y="12.59"/></g></svg>'>
    <title>Neural Network Visualization</title>
    <style>
        .slider-container {
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-right: 20px;
        }

        .slider-group {
            margin: 15px 0;
        }

        .slider {
            width: 150px;
            margin: 10px 0;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #ddd;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #666;
            cursor: pointer;
        }

        .value {
            margin-left: 10px;
            font-size: 14px;
            color: #666;
        }

    </style>
</head>
<body>
    <div class="slider-group">
        <label for="input1">Sepal Length (cm):</label>
        <input type="range" id="input1" class="slider" min="4.3" max="7.9" step="0.1" value="5.8">
        <span class="value">5.8</span>
    </div>
    
    <div class="slider-group">
        <label for="input2">Sepal Width (cm):</label>
        <input type="range" id="input2" class="slider" min="2.0" max="4.4" step="0.1" value="3.1">
        <span class="value">3.1</span>
    </div>
    
    <div class="slider-group">
        <label for="input3">Petal Length (cm):</label>
        <input type="range" id="input3" class="slider" min="1.0" max="6.9" step="0.1" value="3.8">
        <span class="value">3.8</span>
    </div>
    
    <div class="slider-group">
        <label for="input4">Petal Width (cm):</label>
        <input type="range" id="input4" class="slider" min="0.1" max="2.5" step="0.1" value="1.2">
        <span class="value">1.2</span>
    </div>
    
    
    <canvas id="nnCanvas" width="900" height="400"></canvas>
    <script>
        const networkWeights={hiddenLayer1:[[.735644519329071,.3177805244922638,.09042768180370331,-.3912585377693176,-.5830795764923096,.08426546305418015,-.5449392795562744,-.855331301689148],[.053792234510183334,-.10639289766550064,.5948939919471741,.3345770239830017,-.004467169754207134,-.6792614459991455,.18675349652767181,.004493142478168011],[-.0587579645216465,-.0560113750398159,-.7719243168830872,.9348520636558533,-.2796390652656555,.1827164590358734,-.6477202773094177,-.7231994271278381],[-.03985108062624931,-.4188218414783478,.05762738734483719,.7354803681373596,.16144703328609467,-.017947735264897346,.22196072340011597,-.5746248960494995]],hiddenLayer2:[[.5657013058662415,.5656464695930481,-.325158953666687,.059656571596860886,-.15302161872386932,.6336928606033325,-.2407744973897934,-.4486117959022522],[.1515493243932724,.02298085018992424,-.26110896468162537,.16900423169136047,.15637743473052979,.12706144154071808,-.7492126822471619,-.3337307870388031],[-.4011739492416382,-.0528370700776577,-.19721205532550812,-.2657918930053711,.6662789583206177,-.37613362073898315,.027986904606223106,-.35088402032852173],[-.11826801300048828,.8408482670783997,.04847615212202072,.009272100403904915,-.21005553007125854,.16657209396362305,.7061954736709595,.07647129148244858],[-.29186534881591797,-.1399603635072708,.7187729477882385,.37095001339912415,.06825496256351471,.45177870988845825,-.6315124034881592,.24178893864154816],[-.05406739562749863,-.26323097944259644,-.5299726128578186,.36993491649627686,-.31922295689582825,.8382170796394348,.2734885811805725,-.22080925107002258],[-.10817844420671463,-.39505520462989807,.3639334440231323,-.24675042927265167,.3966992497444153,.2580414414405823,-.023913808166980743,-.4223770499229431],[.44136324524879456,-.5451613664627075,.4548623263835907,.20906056463718414,.3108867406845093,-.2653261125087738,-.4522208869457245,-.271598756313324]],outputLayer:[[.06840229779481888,.2001710683107376,.2284606546163559],[-.2202129065990448,-.3475169539451599,.4548289179801941],[.8625234961509705,-.05147825554013252,-.6201745271682739],[-.14652416110038757,.7429859638214111,-.2767881155014038],[.5958781242370605,-.45110177993774414,-.44393619894981384],[-.7552685141563416,.25752484798431396,.028694892302155495],[-.2769957482814789,-.3595741391181946,.8178912401199341],[.6223520636558533,.07126292586326599,-.6023269295692444]]};

        function standardScale(input) {
            // These values should match your saved scaler
            const means = [5.843333, 3.057333, 3.758000, 1.199333];
            const stds = [0.828066, 0.435866, 1.765298, 0.762238];
            
            return input.map((x, i) => (x - means[i]) / stds[i]);
        }

        function computeNetwork(input, weights) {
            function sigmoid(x) {
                return 1 / (1 + Math.exp(-x));
            }
            
            function softmax(arr) {
                const expValues = arr.map(x => Math.exp(x));
                const sumExp = expValues.reduce((a, b) => a + b, 0);
                return expValues.map(exp => exp / sumExp);
            }
            
            const inputSize = 4;
            const hidden1Size = 8;
            const hidden2Size = 8;
            const outputSize = 3;
            
            // Hidden layers use sigmoid
            let hidden1 = Array(hidden1Size).fill(0);
            for(let i = 0; i < hidden1Size; i++) {
                let sum = 0;
                for(let j = 0; j < inputSize; j++) {
                    sum += input[j] * weights.hiddenLayer1[j][i];
                }
                hidden1[i] = sigmoid(sum);
            }
            
            let hidden2 = Array(hidden2Size).fill(0);
            for(let i = 0; i < hidden2Size; i++) {
                let sum = 0;
                for(let j = 0; j < hidden1Size; j++) {
                    sum += hidden1[j] * weights.hiddenLayer2[j][i];
                }
                hidden2[i] = sigmoid(sum);
            }
            
            // Output layer uses softmax
            let outputPreSoftmax = Array(outputSize).fill(0);
            for(let i = 0; i < outputSize; i++) {
                let sum = 0;
                for(let j = 0; j < hidden2Size; j++) {
                    sum += hidden2[j] * weights.outputLayer[j][i];
                }
                outputPreSoftmax[i] = sum;
            }
            const output = softmax(outputPreSoftmax);
            
            return {
                inputLayer: Array(4).fill(true),
                hiddenLayer1: hidden1.map(x => x > 0.5),
                hiddenLayer2: hidden2.map(x => x > 0.5),
                outputLayer: output.map((x, i) => i === output.indexOf(Math.max(...output))),
                probabilities: output
            };
        }

        // Add this function to draw output probabilities
        function drawOutputLabels(x, y, probabilities, spacing) {
            const classes = ['Setosa', 'Versicolor', 'Virginica'];
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            
            for(let i = 0; i < probabilities.length; i++) {
                const yPos = (i + 1) * spacing;
                const text = `${classes[i]}: ${(probabilities[i] * 100).toFixed(1)}%`;
                ctx.fillText(text, x + 30, yPos);
            }
        }

        // Set random initial values for sliders
        document.querySelectorAll('.slider').forEach(slider => {
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            const randomValue = (Math.random() * (max - min) + min).toFixed(1);
            
            slider.value = randomValue;
            slider.nextElementSibling.textContent = randomValue;
        });

        // Add event listeners to all sliders
        document.querySelectorAll('.slider').forEach(slider => {
            const valueSpan = slider.parentElement.querySelector('.value');
            
            slider.addEventListener('input', (e) => {
                valueSpan.textContent = e.target.value;
            });
        });

        const canvas = document.getElementById('nnCanvas');
        const ctx = canvas.getContext('2d');
        // Set global styles for all elements
        ctx.strokeStyle = 'rgba(128, 128, 128, 0.6)';  // Semi-transparent gray for lines
        ctx.fillStyle = 'rgba(240, 240, 240, 0.5)';    // Very light gray fill for neurons

        function drawNeuron(x, y, radius = 20, isActive = false) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 2; 
            ctx.strokeStyle = isActive ? 'rgba(0, 0, 0, 0.8)' : 'rgba(128, 128, 128, 0.6)';
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        // Update the drawConnections function
        function drawConnections(startX, startN, endX, endN, color = 'rgba(128, 128, 128, 0.6)') {
            const startSpacing = height / (startN + 1);
            const endSpacing = height / (endN + 1);
            
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3;  // Make lines semi-transparent
            ctx.strokeStyle = color;  // Use the passed color parameter

            for(let i = 0; i < startN; i++) {
                for(let j = 0; j < endN; j++) {
                    ctx.beginPath();
                    ctx.moveTo(startX, (i + 1) * startSpacing);
                    ctx.lineTo(endX, (j + 1) * endSpacing);
                    ctx.stroke();
                }
            }
            ctx.globalAlpha = 1;  // Reset transparency for other elements
        }

        function drawInputLabels(x, y, value, spacing) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(value.toFixed(1), x - 30, y);
        }

        function drawLayer(startX, neurons, activations = []) {
            const spacing = height / (neurons + 1);
            for(let i = 0; i < neurons; i++) {
                const yPos = (i + 1) * spacing;
                // Use activation state from the array, default to false if not specified
                const isActive = activations[i] || false;
                drawNeuron(startX, yPos, 20, isActive);
                
                // Only add labels for input layer
                if (startX === layer1X) {
                    const slider = document.getElementById(`input${i + 1}`);
                    drawInputLabels(startX, yPos, parseFloat(slider.value), spacing);
                }
            }
            return spacing;
        }

        // Define the network activation state structure
        const networkState = {
            inputLayer: Array(4).fill(true),
            hiddenLayer1: Array(8).fill(false),
            hiddenLayer2: Array(8).fill(false),
            outputLayer: Array(3).fill(true)
        };

        function drawAllLayers(activationState = networkState) {
            drawLayer(layer1X, 4, activationState.inputLayer);
            drawLayer(layer2X, 8, activationState.hiddenLayer1);
            drawLayer(layer3X, 8, activationState.hiddenLayer2);
            drawLayer(layer4X, 3, activationState.outputLayer);
            
            drawConnections(layer1X, 4, layer2X, 8);
            drawConnections(layer2X, 8, layer3X, 8);
            drawConnections(layer3X, 8, layer4X, 3);
        }


        const width = canvas.width;
        const height = canvas.height;
        
        // Layer positions
        const layer1X = 100;  // Input layer
        const layer2X = 300;  // First hidden layer
        const layer3X = 500;  // Second hidden layer
        const layer4X = 700;  // Output layer
        
        drawAllLayers()
        // // Draw connections
        // drawConnections(layer1X, 4, layer2X, 8);
        // drawConnections(layer2X, 8, layer3X, 8);
        // drawConnections(layer3X, 8, layer4X, 3);

        // // Draw layers
        // drawLayer(layer1X, 4);   // 4 input neurons
        // drawLayer(layer2X, 8);   // 8 first hidden layer neurons
        // drawLayer(layer3X, 8);   // 8 second hidden layer neurons
        // drawLayer(layer4X, 3);   // 3 output neurons
        // Modify the event listener
        document.querySelectorAll('.slider').forEach(slider => {
            slider.addEventListener('input', () => {
                const inputs = Array.from(document.querySelectorAll('.slider')).map(s => parseFloat(s.value));
                const scaledInputs = standardScale(inputs);
                console.log(scaledInputs);
                const networkOutput = computeNetwork(scaledInputs, networkWeights);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawAllLayers(networkOutput);
                drawOutputLabels(layer4X, height / 4, networkOutput.probabilities, height / 4);
            });
        });
    </script>
</body>
</html>
